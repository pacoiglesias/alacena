  <!-- Luxury Web Audio Synthesizer (Zero Latency, Zero Dependencies) -->
  <script>
    window.luxuryAudioCtx = null;
    window.luxurySoundMuted = false;

    window.setLuxurySoundMuted = function(muted) {
      window.luxurySoundMuted = !!muted;
    };

    window.playLuxurySound = function(type) {
      if (window.luxurySoundMuted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!window.luxuryAudioCtx) {
          window.luxuryAudioCtx = new AudioCtx();
        }
        if (window.luxuryAudioCtx.state === 'suspended') {
          window.luxuryAudioCtx.resume();
        }
        const ctx = window.luxuryAudioCtx;
        const now = ctx.currentTime;

        if (type === 'click') {
          // Micro-click de titanio táctil
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.03);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 'success') {
          // Chime armónico de triunfo (E5 -> G#5 -> B5)
          const notes = [659.25, 830.61, 987.77];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.055);
            gain.gain.setValueAtTime(0.10, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.25);
          });
        } else if (type === 'warning') {
          // Tono dual cálido de advertencia o stock bajo
          [440, 554.37].forEach(freq => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.10, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
          });
        } else if (type === 'cook') {
          // Doble campana armónica de cocina de chef
          [523.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.14, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.32);
          });
        } else if (type === 'delete') {
          // Tick grave de descarte o borrado
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {
        console.warn('AudioContext playback error', e);
      }
    };
  </script>
</head>
