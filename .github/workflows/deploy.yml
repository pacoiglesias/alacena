name: Desplegar Alacena

# Despliega hosting y Cloud Functions en alacena-enterprise-prod
# usando federacion de identidades (WIF): GitHub se autentica
# directamente con Google, sin clave JSON. No usa secretos.
#
# NOTA: las reglas de Firestore/Storage (firestore.rules,
# firestore.indexes.json, storage.rules) NO se despliegan aquí a
# propósito. Publicarlas exige ANTES actualizar el claim del
# propietario (scripts/configure_owner_access.cjs, con los IDs de sus
# casas) y que Paco cierre y vuelva a abrir sesión; si las reglas
# nuevas se publican con el claim viejo, la app pierde el acceso.
# Las reglas se despliegan a mano, por separado. Por eso firestore.*
# tampoco está en los paths de este trigger.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-alacena
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            functions/package-lock.json

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.35.0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/563016091019/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'alacena-agent@alacena-enterprise-prod.iam.gserviceaccount.com'

      - name: Instalar dependencias de Functions
        working-directory: functions
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desplegar hosting y funciones
        run: firebase deploy --only hosting,functions --project alacena-enterprise-prod --non-interactive
