name: Desplegar Alacena

# Despliega hosting y Cloud Functions en alacena-enterprise-prod
# usando la cuenta de servicio guardada en el secreto
# FIREBASE_SERVICE_ACCOUNT (JSON de la clave).
# El secreto FIREBASE_TOKEN viejo ya no se usa.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Escribir credencial de la cuenta de servicio
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ github.workspace }}/service-account.json

      - name: Instalar dependencias de Functions
        working-directory: functions
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desplegar hosting y funciones
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: firebase deploy --only hosting,functions --project alacena-enterprise-prod --non-interactive
